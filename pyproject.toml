[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtverify"
version = "0.1.0"
description = "Four-gate verification for any machine translation service: alive, intact, accurate, still good."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Karthick Raja M", email = "Karthickrajam18@gmail.com" }]
dependencies = [
  "sacrebleu>=2.4",
  "lingua-language-detector>=2.0",
  "httpx>=0.27",
  "pydantic>=2.5",
]

[project.optional-dependencies]
comet = ["unbabel-comet>=2.2"]
labse = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
mtverify = "mtverify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtverify = ["py.typed", "data/*.jsonl"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
